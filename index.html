<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Learning Lab - Animation Demo</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>Docker Learning Lab</h1>

        <p>
            Click the buttons to trigger animations and learn about Docker deployment!
        </p>

        <div class="button-group">
            <button id="btn1" class="animation-btn">Animation 1</button>
            <button id="btn2" class="animation-btn">Animation 2</button>
        </div>

        <div id="animation-target" class="animation-target">
            <div class="box"></div>
        </div>
    </div>

    <!-- Hidden Easter Egg Popup -->
    <div id="secret-popup" class="secret-popup" aria-hidden="true">
        <div class="secret-popup-content">
            <button id="close-popup" class="close-popup" aria-label="Close popup">
                ×
            </button>

            <div class="secret-icon">✦</div>

            <h2>Cryptic Horizon</h2>

            <p>I sincerely appreciate the time and careful effort you have dedicated to this. Once again, thank you.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
